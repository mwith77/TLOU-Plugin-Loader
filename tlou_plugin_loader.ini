; tlou_plugin_loader.ini - settings for the plugin loader.
; Lives in <game>\Mods\Plugin Loader\ and is read once, when the game starts.

[overrides]
; Force a plugin to load even when its SupportsGame reports it does not support
; this game version. Name it by its DLL file name. Use with caution.
;   force_someplugin.dll = 1
