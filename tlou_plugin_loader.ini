[launcher]
; What the launcher starts. Leave as launcher.exe, which builds the game's
; command line from pkgconfig.txt:
;   Steam -> prelaunch.cmd -> launcher.exe -> tlou-i.exe
target = launcher.exe

timeout_ms = 120000

[overrides]
; force loading a plugin that refuses to load. Use with caution.
;   force_someplugin.dll = 1
